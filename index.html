const rd=f=>new Promise((r,j)=>{const x=new FileReader;x.onload=()=>r(x.result);x.onerror=j;x.readAsDataURL(f)});
async function shrink(src,max,q=.85,png){if(/^data:image\/(svg|gif)/.test(src))return src;const im=new Image;await new Promise((r,j)=>{im.onload=r;im.onerror=j;im.src=src});const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const x=c.getContext('2d');if(!png){x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height)}x.drawImage(im,0,0,c.width,c.height);const o=c.toDataURL(png?'image/png':'image/jpeg',q);return o.length<src.length?o:src}
const pic=async(file,png)=>{const d=await rd(file);try{return await shrink(d,S.img.max,.85,png&&file.type=='image/png')}catch(e){return d}};
function pick(cb,multi,png){const i=document.createElement('input');i.type='file';i.accept='image/*';i.multiple=!!multi;i.onchange=async()=>{const fs=[...i.files];for(const f of fs){try{cb(await pic(f,png),f.name)}catch(e){flash('Could not read '+f.name,1)}}};i.click()}

/* import */
const KM={name:['productname','name','product','item','itemname','title'],code:['productcode','code','sku','itemcode','id'],cat:['category','cat','type'],desc:['description','desc','details'],size:['size','dimensions','dimension'],th:['thickness'],gr:['grade'],price:['price','rate'],img:['imagename','image'],url:['imageurl','imagelink','url'],mat:['material','materialtype'],qty:['quantity','qty','availablequantity'],unit:['unit']},FN={name:'Product Name',code:'Product Code',cat:'Category',desc:'Description',size:'Size',th:'Thickness',gr:'Grade',price:'Price',img:'Image Name',url:'Image URL',mat:'Material',qty:'Quantity',unit:'Unit'};
const nk=s=>String(s).toLowerCase().replace(/[^a-z0-9]/g,''),fk=h=>{const k=nk(h);for(const f in KM)if(KM[f].includes(k))return f;return''};
function parseText(t){const out=[];let c=null,skipped=0;const push=()=>{if(c&&c.name)out.push(c);c=null};
 t.split(/\r?\n/).forEach(line=>{if(!line.trim()){return}const m=line.match(/^\s*([A-Za-z][A-Za-z ]{0,30}?)\s*[:=]\s*(.*)$/),f=m&&fk(m[1]);
  if(f){if(f=='name'&&c&&c.name)push();if(!c)c={};c[f]=m[2].trim()}else if(c){c.desc=((c.desc||'')+' '+line.trim()).trim()}else skipped++});push();return{rows:out,skipped}}
function csvRows(t){const r=[];let row=[],f='',q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=ch}else if(ch=='"')q=true;else if(ch==','){row.push(f);f=''}else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;row.push(f);f='';if(row.some(x=>x.trim()))r.push(row);row=[]}else f+=ch}row.push(f);if(row.some(x=>x.trim()))r.push(row);return r}
function csvMap(){const c=AS.csv;return `<div class="card"><b>Map columns</b>${c.h.map((h,i)=>`<div class="row"><span>${esc(h)}</span><select data-cm="${i}"><option value="">Ignore</option>${Object.keys(FN).map(k=>`<option value="${k}" ${c.m[i]==k?'selected':''}>${FN[k]}</option>`).join('')}</select></div>`).join('')}${B('csvgo','Preview import')}</div>`}
